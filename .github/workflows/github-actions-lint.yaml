# actionlint と ghalint と zizmor を使って GitHub Actions の静的解析する
# - actionlint: https://github.com/rhysd/actionlint
# - ghalint: https://github.com/suzuki-shunsuke/ghalint
# - zizmor: https://github.com/zizmorcore/zizmor
name: github-actions-lint

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - .github/workflows/actions.lock
      - .github/actions/**
      - .github/ghalint.yaml
      - .github/actionlint.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5.2.2
        with:
          mise_toml: |
            [tools]
            # renovate: datasource=github-releases depName=actionlint packageName=rhysd/actionlint
            actionlint = "1.7.12"
            # renovate: datasource=github-releases depName=ghalint packageName=suzuki-shunsuke/ghalint
            "github:suzuki-shunsuke/ghalint" = "1.6.0"
            # renovate: datasource=github-releases depName=zizmor packageName=zizmorcore/zizmor
            zizmor = "1.32.0"

      - name: Run actionlint
        # actionlint 1.7.12 does not yet recognize Ubuntu 26.04 or same-repository $/ actions.
        # https://github.com/rhysd/actionlint/issues/682
        run: |
          actionlint -color \
            -ignore '^label "ubuntu-26\.04(-arm)?" is unknown\.' \
            -ignore '^specifying action "\$/\.github/actions/[^" ]+" in invalid format because ref is missing\.'

      - name: Run ghalint
        run: |
          ghalint run
          ghalint run-action

      - name: Run zizmor
        run: zizmor --strict-collection --collect=workflows,actions .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
